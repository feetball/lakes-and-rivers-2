# Builds the Android app bundle (.aab) on a GitHub-hosted Linux runner and
# uploads it to Google Play. Run it from Actions → "Android Play" → Run workflow.
# On pull requests that touch the Android build it only checks that an
# (unsigned) release bundle still builds.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE      the upload keystore (.jks), base64-encoded:
#                                  base64 -w0 upload-keystore.jks   (macOS: base64 -i)
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias inside the keystore (e.g. "upload")
#   ANDROID_KEY_PASSWORD         key password (often the same as the keystore's)
#   PLAY_SERVICE_ACCOUNT_JSON    Play Console → Setup → API access: a service
#                                  account with release permission for this app,
#                                  the full contents of its JSON key. Optional:
#                                  without it the signed .aab is only kept as a
#                                  run artifact (that's how the first upload,
#                                  which Play requires in the browser, works).
# Optional: MOBILE_API_BASE (see docs/mobile-app.md).
name: Android Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: >-
          Release status. Must be "draft" until the app has been published
          once; after that "completed" rolls the release out straight away.
        type: choice
        options: [draft, completed]
        default: draft
  pull_request:
    paths:
      - android/**
      - capacitor.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/android-play.yml

concurrency:
  group: android-play-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MOBILE_API_BASE: ${{ secrets.MOBILE_API_BASE }}
      RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web bundle + cap sync
        run: |
          pnpm mobile:export
          pnpm exec cap sync android

      - name: Write upload keystore
        if: env.RELEASE == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE is not set; see the comment at the top of this workflow."
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Version codes must rise on every upload; the run number does that
        # (offset past the hand-set versionCode 1 in build.gradle).
        run: |
          export ANDROID_VERSION_CODE=$(( GITHUB_RUN_NUMBER + 1 ))
          echo "versionCode $ANDROID_VERSION_CODE"
          ./gradlew --no-daemon bundleRelease

      - name: Keep the bundle
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        if: env.RELEASE == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing was uploaded. Download the app-release artifact and upload it in Play Console."
            echo "SKIP_PLAY_UPLOAD=1" >> "$GITHUB_ENV"
          fi

      - if: env.RELEASE == 'true' && env.SKIP_PLAY_UPLOAD != '1'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.texasfloodmap.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
